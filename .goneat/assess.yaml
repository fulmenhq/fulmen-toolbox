version: 1
lint:
  yamllint:
    enabled: true
    strict: true
    paths:
      - ".github/workflows/**/*.yml"
      - ".github/workflows/**/*.yaml"
      - ".github/*.yaml"
      - ".github/*.yml"
      - "subsystems/**/*.yaml"
      - "subsystems/**/*.yml"
    ignore: []
  shell:
    shfmt:
      enabled: true
      fix: true
    shellcheck:
      enabled: false
      path: ""
    paths:
      - "**/*.sh"
      - "scripts/**/*.sh"
    ignore:
      - "**/node_modules/**"
      - "**/.git/**"
      - "**/vendor/**"
      - "**/*.orig"
      - "**/testdata/**"
      - ".plans/**"
  github_actions:
    actionlint:
      enabled: true
      paths:
        - ".github/workflows/**/*.yml"
        - ".github/workflows/**/*.yaml"
      ignore: []
  make:
    # Re-enabled in v0.4.1 once the `.PHONY:` block was rewritten as multiple
    # directives (checkmake's `phonydeclared` rule mis-parses backslash
    # continuation; multi-directive form is parser-friendly and equivalent).
    # max_body_length=55 accommodates the multi-image build/test fan-out
    # targets which legitimately need long recipes; min_phony_targets omits
    # `test` because this repo uses `test-all` (the matrix-driven aggregate)
    # rather than a bare `test` target.
    checkmake:
      enabled: true
      config:
        # 120 accommodates `prereqs` (114 lines of shell-style tool checks).
        # Lower threshold would force extraction to scripts/, which is
        # better-but-bigger refactor; defer to v0.5.x if appetite for it.
        max_body_length: 120
        min_phony_targets:
          - all
          - clean
    paths:
      - "**/Makefile"
    ignore: []
