name: Validate Toolbox Manifests
on:
  pull_request:
    paths:
      - "manifests/**"
      - "schemas/**"
      - "scripts/**"
      - "images/**"
      - "Makefile"
      - ".github/workflows/**"
  push:
    branches: [main, master]
    paths:
      - "manifests/**"
      - "schemas/**"
      - "scripts/**"
      - "images/**"
      - "Makefile"
      - ".github/workflows/**"
jobs:
  validate:
    runs-on: ubuntu-latest-x64-m
    steps:
      - name: Show initial disk usage
        run: |
          echo "=== Initial disk usage ==="
          df -h /
          echo "=== Docker images ==="
          docker images 2>/dev/null || true
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          docker image prune -af || true
          sudo apt-get clean || true
      - name: Show disk usage after cleanup
        run: |
          echo "=== Disk usage after cleanup ==="
          df -h /
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assert license-check CI split and cache key
        run: make test-validate-licenses-ci
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Resolve Go version (from manifests)
        id: go-version
        run: |
          GO_VERSION="$(jq -r '.tools[] | select(.name=="go") | .version' manifests/tools.json)"
          test -n "$GO_VERSION"
          echo "version=$GO_VERSION" >> "$GITHUB_OUTPUT"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go-version.outputs.version }}
      - name: Resolve lint tool versions (from manifests)
        run: |
          YAMLFMT_VERSION="$(jq -r '.tools[] | select(.name=="yamlfmt") | .version' manifests/tools.json)"
          ACTIONLINT_VERSION="$(jq -r '.tools[] | select(.name=="actionlint") | .version' manifests/tools.json)"
          test -n "$YAMLFMT_VERSION" && test -n "$ACTIONLINT_VERSION"
          echo "YAMLFMT_VERSION=$YAMLFMT_VERSION" >> "$GITHUB_ENV"
          echo "ACTIONLINT_VERSION=$ACTIONLINT_VERSION" >> "$GITHUB_ENV"
      - name: Install yamlfmt + actionlint
        run: |
          go install github.com/google/yamlfmt/cmd/yamlfmt@${{ env.YAMLFMT_VERSION }}
          go install github.com/rhysd/actionlint/cmd/actionlint@${{ env.ACTIONLINT_VERSION }}
        env:
          GOBIN: ${{ github.workspace }}/bin
      - name: Add GOBIN to PATH
        run: echo "${{ github.workspace }}/bin" >> "$GITHUB_PATH"
      - name: Validate manifest schema
        run: make validate-manifest
      - name: Validate APK pins on amd64 and arm64
        run: make validate-apk-pins
      - name: Validate baseline profiles
        run: make validate-profiles
      - name: Lint workflows (yamlfmt)
        run: make lint-workflows
  docker-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest-x64-m
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          docker image prune -af || true
          sudo apt-get clean || true
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: "Optional: quick docker build (PR confidence)"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/goneat-tools/Dockerfile
          target: runner
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=pr-goneat-tools-runner
          cache-to: type=gha,mode=max,scope=pr-goneat-tools-runner
  # Dedicated job so license image builds run in parallel with schema/pin
  # checks and the PR docker-build job. Do not add a `needs:` gate: the
  # checker builds its own images from this checkout.
  validate-licenses:
    runs-on: ubuntu-latest-x64-m
    steps:
      - name: Show initial disk usage
        run: |
          echo "=== Initial disk usage ==="
          df -h /
          echo "=== Docker images ==="
          docker images 2>/dev/null || true
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          docker image prune -af || true
          sudo apt-get clean || true
      - name: Show disk usage after cleanup
        run: |
          echo "=== Disk usage after cleanup ==="
          df -h /
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore license-check cache
        id: license-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .cache/license-validation
          key: license-validation-v1-${{ runner.os }}-${{ hashFiles('manifests/tools.json', 'scripts/validate-licenses.sh', 'images/**', 'Makefile') }}
      - name: Validate curated licenses
        id: license-check
        run: |
          set -euo pipefail
          RESULT_DIR=".cache/license-validation"
          RESULT_FILE="${RESULT_DIR}/result"
          cache_hit="${{ steps.license-cache.outputs.cache-hit }}"
          if [ "$cache_hit" = "true" ] && [ -f "$RESULT_FILE" ]; then
            got="$(cat "$RESULT_FILE")"
            if [ "$got" = "ok" ]; then
              echo "License validation cache hit; skipping make validate-licenses"
              echo "cache_used=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Cached license result is invalid; failing closed and running full check"
          else
            echo "License validation cache miss or restore error; running full check"
          fi
          echo "cache_used=false" >> "$GITHUB_OUTPUT"
          rm -rf "$RESULT_DIR"
          make validate-licenses
          mkdir -p "$RESULT_DIR"
          printf '%s\n' "ok" > "$RESULT_FILE"
      - name: Save license-check cache
        if: success() && steps.license-check.outputs.cache_used != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/license-validation
          key: license-validation-v1-${{ runner.os }}-${{ hashFiles('manifests/tools.json', 'scripts/validate-licenses.sh', 'images/**', 'Makefile') }}
