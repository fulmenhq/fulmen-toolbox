name: Release (build, sbom, checksums)
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
jobs:
  build:
    # Per-arch build on a native runner. Each cell pushes by digest only;
    # the manifest job composes the multi-arch manifest at the public tags.
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - family: goneat-tools
            image: goneat-tools-runner-musl
            target: runner
          - family: goneat-tools
            image: goneat-tools-slim-musl
            target: slim
          - family: goneat-tools-glibc
            image: goneat-tools-runner-glibc
            target: runner
          - family: sbom-tools
            image: sbom-tools-runner-musl
            target: runner
          - family: sbom-tools
            image: sbom-tools-slim-musl
            target: slim
          - family: sbom-tools-glibc
            image: sbom-tools-runner-glibc
            target: runner
          - family: valkey
            image: valkey-server-glibc
            target: server
        platform:
          - name: linux/amd64
            arch: amd64
            runner: ubuntu-latest-m
          - name: linux/arm64
            arch: arm64
            runner: ubuntu-latest-arm64-s
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        run: |
          echo "=== Disk usage before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          docker image prune -af || true
          sudo apt-get clean || true
          echo "=== Disk usage after cleanup ==="
          df -h /
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/${{ matrix.image.family }}/Dockerfile
          target: ${{ matrix.image.target }}
          platforms: ${{ matrix.platform.name }}
          outputs: |
            type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.image }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.image }}-${{ matrix.platform.arch }}
      - name: Export digest
        run: |
          set -eu
          mkdir -p "/tmp/digests/${{ matrix.image.image }}"
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${{ matrix.image.image }}/${digest#sha256:}"
      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image.image }}-${{ matrix.platform.arch }}
          path: /tmp/digests/${{ matrix.image.image }}/*
          if-no-files-found: error
          retention-days: 1
  manifest:
    # Compose per-arch digests into a multi-arch manifest at every public
    # tag (canonical + aliases). Generate SBOM and SHA256SUMS against the
    # composed manifest digest; upload to the GitHub release page.
    needs: build
    runs-on: ubuntu-latest-m
    strategy:
      fail-fast: false
      # Cap concurrent manifest/alias publishes. Full 7-way concurrency hit
      # GHCR write throttling (HTTP 429 on blob upload / manifest PUT) during
      # v0.5.0-rc.1 and v0.5.0 — re-running a single failed cell alone always
      # passed. max-parallel: 2 keeps release wall-clock reasonable while
      # staying under GHCR's undocumented write ceiling. Pair with the
      # imagetools retry below; neither alone is sufficient if the ceiling
      # moves.
      max-parallel: 2
      matrix:
        include:
          - family: goneat-tools
            image: goneat-tools-runner-musl
            aliases: |
              goneat-tools-runner
              goneat-tools
              goneat-tools-runner-alpine
          - family: goneat-tools
            image: goneat-tools-slim-musl
            aliases: |
              goneat-tools-slim
              goneat-tools-slim-alpine
          - family: goneat-tools-glibc
            image: goneat-tools-runner-glibc
            aliases: |
              goneat-tools-runner-debian
          - family: sbom-tools
            image: sbom-tools-runner-musl
            aliases: |
              sbom-tools-runner
              sbom-tools
              sbom-tools-runner-alpine
          - family: sbom-tools
            image: sbom-tools-slim-musl
            aliases: |
              sbom-tools-slim
              sbom-tools-slim-alpine
          - family: sbom-tools-glibc
            image: sbom-tools-runner-glibc
            aliases: |
              sbom-tools-runner-debian
          - family: valkey
            image: valkey-server-glibc
            aliases: ""
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set version env
        id: meta
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          MAJOR="${VERSION%%.*}"
          {
            echo "VERSION=$VERSION"
            echo "MAJOR=$MAJOR"
          } >> "$GITHUB_ENV"
          {
            echo "version=$VERSION"
            echo "major=$MAJOR"
          } >> "$GITHUB_OUTPUT"
      - name: Compute tags
        id: tags
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
          ALIASES: ${{ matrix.aliases }}
        run: |
          set -eu
          # Pre-release versions (e.g. v0.4.2-rc.1) publish only the exact
          # :v<version> tag — :latest and :v<major> stay pinned to the last
          # stable release. Detected by presence of "-" in VERSION.
          case "$VERSION" in
            *-*) PRERELEASE=1 ;;
            *) PRERELEASE=0 ;;
          esac
          if [ "$PRERELEASE" = "1" ]; then
            CANON_TAGS="$REGISTRY/$OWNER/$IMAGE:v$VERSION"
          else
            CANON_TAGS=$(printf '%s\n' \
              "$REGISTRY/$OWNER/$IMAGE:latest" \
              "$REGISTRY/$OWNER/$IMAGE:v$MAJOR" \
              "$REGISTRY/$OWNER/$IMAGE:v$VERSION")
          fi
          TAGS="$CANON_TAGS"
          if [ -n "${ALIASES}" ]; then
            while IFS= read -r alias; do
              [ -n "$alias" ] || continue
              if [ "$PRERELEASE" = "1" ]; then
                TAGS="${TAGS}"$'\n'"$REGISTRY/$OWNER/$alias:v$VERSION"
              else
                TAGS="${TAGS}"$'\n'"$REGISTRY/$OWNER/$alias:latest"$'\n'"$REGISTRY/$OWNER/$alias:v$MAJOR"$'\n'"$REGISTRY/$OWNER/$alias:v$VERSION"
              fi
            done <<< "$ALIASES"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Download digest artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Compose multi-arch manifest
        id: compose
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -eu
          # Build digest refs from the per-arch digest filenames.
          DIGEST_REFS=""
          for f in /tmp/digests/*; do
            [ -e "$f" ] || continue
            sha="$(basename "$f")"
            DIGEST_REFS="$DIGEST_REFS $REGISTRY/$OWNER/$IMAGE@sha256:$sha"
          done
          if [ -z "$DIGEST_REFS" ]; then
            echo "❌ no per-arch digests found for $IMAGE" >&2
            exit 1
          fi
          # Build tag args (-t per public tag).
          TAG_ARGS=""
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            TAG_ARGS="$TAG_ARGS -t $tag"
          done <<< "$TAGS"
          echo "Composing manifest for $IMAGE"
          echo "  sources:$DIGEST_REFS"
          echo "  tags:$TAG_ARGS"
          # Retry under GHCR write throttling (429). max-parallel lowers the
          # collision rate but the ceiling is undocumented and can shift;
          # backoff covers residual blips without a full job re-run.
          # shellcheck disable=SC2086
          attempt=1
          max_attempts=5
          delay=15
          while true; do
            if docker buildx imagetools create $TAG_ARGS $DIGEST_REFS; then
              break
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "❌ imagetools create failed after ${max_attempts} attempts" >&2
              exit 1
            fi
            echo "⚠️ imagetools create failed (attempt ${attempt}/${max_attempts}); retrying in ${delay}s..."
            sleep "$delay"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done
          # Resolve composed manifest digest from canonical :v<version> tag.
          CANON_REF="$REGISTRY/$OWNER/$IMAGE:v$VERSION"
          DIGEST=$(docker buildx imagetools inspect "$CANON_REF" --format '{{json .Manifest}}' | jq -r '.digest')
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            echo "❌ unable to resolve composed manifest digest for $CANON_REF" >&2
            exit 1
          fi
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"
      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}@${{ env.DIGEST }}
          format: spdx-json
          output-file: sbom-${{ matrix.image }}-${{ steps.meta.outputs.version }}.json
      - name: Generate SHA256SUMS
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          printf "%s\n" "${{ steps.tags.outputs.tags }}" | sed '/^\s*$/d' | while IFS= read -r ref; do
            echo "$DIGEST  $ref"
          done > SHA256SUMS-${{ matrix.image }}
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sbom-${{ matrix.image }}-${{ steps.meta.outputs.version }}.json
            SHA256SUMS-${{ matrix.image }}
          tag_name: v${{ steps.meta.outputs.version }}
          name: v${{ steps.meta.outputs.version }}
          prerelease: ${{ contains(steps.meta.outputs.version, '-') }}
          make_latest: ${{ contains(steps.meta.outputs.version, '-') && 'false' || 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
  cosign:
    needs: manifest
    runs-on: ubuntu-latest-m
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: goneat-tools-runner-musl
            aliases: |
              goneat-tools-runner
              goneat-tools
              goneat-tools-runner-alpine
          - image: goneat-tools-slim-musl
            aliases: |
              goneat-tools-slim
              goneat-tools-slim-alpine
          - image: goneat-tools-runner-glibc
            aliases: |
              goneat-tools-runner-debian
          - image: sbom-tools-runner-musl
            aliases: |
              sbom-tools-runner
              sbom-tools
              sbom-tools-runner-alpine
          - image: sbom-tools-slim-musl
            aliases: |
              sbom-tools-slim
              sbom-tools-slim-alpine
          - image: sbom-tools-runner-glibc
            aliases: |
              sbom-tools-runner-debian
          - image: valkey-server-glibc
            aliases: ""
    permissions:
      id-token: write
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set version env
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "VERSION=$VERSION"
            echo "TAG=v$VERSION"
          } >> "$GITHUB_ENV"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.0"
      - name: Sign and attest images (keyless)
        env:
          COSIGN_YES: "true"
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
          ALIASES: ${{ matrix.aliases }}
        run: |
          set -euo pipefail

          sbom="sbom-$IMAGE-$VERSION.json"
          curl -fsSL "https://github.com/$OWNER/fulmen-toolbox/releases/download/v$VERSION/$sbom" -o "$sbom"

          names=("$IMAGE")
          if [ -n "${ALIASES}" ]; then
            while IFS= read -r alias; do
              [ -n "$alias" ] || continue
              names+=("$alias")
            done <<< "$ALIASES"
          fi

          for name in "${names[@]}"; do
            ref="$REGISTRY/$OWNER/$name:v$VERSION"
            digest=$(docker manifest inspect "$ref" -v 2>/dev/null | \
              jq -r 'if type == "array" then .[0].Descriptor.digest else .config.digest end') || true
            if [ -z "$digest" ] || [ "$digest" = "null" ]; then
              echo "❌ Unable to resolve digest for $ref" >&2
              exit 1
            fi

            cosign sign "$REGISTRY/$OWNER/$name@$digest"
            cosign attest --predicate "$sbom" --type spdxjson "$REGISTRY/$OWNER/$name@$digest"
          done
