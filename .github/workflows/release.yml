name: Release (build, sbom, checksums)
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: goneat-tools
            image: goneat-tools-runner-musl
            target: runner
            aliases: |
              goneat-tools-runner
              goneat-tools
              goneat-tools-runner-alpine
          - family: goneat-tools
            image: goneat-tools-slim-musl
            target: slim
            aliases: |
              goneat-tools-slim
              goneat-tools-slim-alpine
          - family: goneat-tools-glibc
            image: goneat-tools-runner-glibc
            target: runner
            aliases: |
              goneat-tools-runner-debian
          - family: sbom-tools
            image: sbom-tools-runner-musl
            target: runner
            aliases: |
              sbom-tools-runner
              sbom-tools
              sbom-tools-runner-alpine
          - family: sbom-tools
            image: sbom-tools-slim-musl
            target: slim
            aliases: |
              sbom-tools-slim
              sbom-tools-slim-alpine
          - family: sbom-tools-glibc
            image: sbom-tools-runner-glibc
            target: runner
            aliases: |
              sbom-tools-runner-debian
          - family: valkey
            image: valkey-server-glibc
            target: server
            aliases: ""
    permissions:
      contents: write
      packages: write
    steps:
      - name: Free disk space
        run: |
          echo "=== Disk usage before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          docker image prune -af || true
          sudo apt-get clean || true
          echo "=== Disk usage after cleanup ==="
          df -h /
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set version env
        id: meta
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          MAJOR="${VERSION%%.*}"
          {
            echo "VERSION=$VERSION"
            echo "MAJOR=$MAJOR"
          } >> "$GITHUB_ENV"
          {
            echo "version=$VERSION"
            echo "major=$MAJOR"
          } >> "$GITHUB_OUTPUT"
      - name: Compute tags
        id: tags
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
          ALIASES: ${{ matrix.aliases }}
        run: |
          set -eu
          CANON_TAGS=$(printf '%s\n' \
            "$REGISTRY/$OWNER/$IMAGE:latest" \
            "$REGISTRY/$OWNER/$IMAGE:v$MAJOR" \
            "$REGISTRY/$OWNER/$IMAGE:v$VERSION")
          TAGS="$CANON_TAGS"
          if [ -n "${ALIASES}" ]; then
            while IFS= read -r alias; do
              [ -n "$alias" ] || continue
              TAGS="${TAGS}"$'\n'"$REGISTRY/$OWNER/$alias:latest"$'\n'"$REGISTRY/$OWNER/$alias:v$MAJOR"$'\n'"$REGISTRY/$OWNER/$alias:v$VERSION"
            done <<< "$ALIASES"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/${{ matrix.family }}/Dockerfile
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Capture digest
        id: digest
        run: echo "DIGEST=${{ steps.build.outputs.digest }}" >> "$GITHUB_ENV"
      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}@${{ env.DIGEST }}
          format: spdx-json
          output-file: sbom-${{ matrix.image }}-${{ steps.meta.outputs.version }}.json
      - name: Generate SHA256SUMS
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          printf "%s\n" "${{ steps.tags.outputs.tags }}" | sed '/^\s*$/d' | while IFS= read -r ref; do
            echo "$DIGEST  $ref"
          done > SHA256SUMS-${{ matrix.image }}
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sbom-${{ matrix.image }}-${{ steps.meta.outputs.version }}.json
            SHA256SUMS-${{ matrix.image }}
          tag_name: v${{ steps.meta.outputs.version }}
          name: v${{ steps.meta.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
  cosign:
    needs: release
    runs-on: ubuntu-latest
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: goneat-tools-runner-musl
            aliases: |
              goneat-tools-runner
              goneat-tools
              goneat-tools-runner-alpine
          - image: goneat-tools-slim-musl
            aliases: |
              goneat-tools-slim
              goneat-tools-slim-alpine
          - image: goneat-tools-runner-glibc
            aliases: |
              goneat-tools-runner-debian
          - image: sbom-tools-runner-musl
            aliases: |
              sbom-tools-runner
              sbom-tools
              sbom-tools-runner-alpine
          - image: sbom-tools-slim-musl
            aliases: |
              sbom-tools-slim
              sbom-tools-slim-alpine
          - image: sbom-tools-runner-glibc
            aliases: |
              sbom-tools-runner-debian
          - image: valkey-server-glibc
            aliases: ""
    permissions:
      id-token: write
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set version env
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "VERSION=$VERSION"
            echo "TAG=v$VERSION"
          } >> "$GITHUB_ENV"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.0"
      - name: Sign and attest images (keyless)
        env:
          COSIGN_YES: "true"
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
          ALIASES: ${{ matrix.aliases }}
        run: |
          set -euo pipefail

          sbom="sbom-$IMAGE-$VERSION.json"
          curl -fsSL "https://github.com/$OWNER/fulmen-toolbox/releases/download/v$VERSION/$sbom" -o "$sbom"

          names=("$IMAGE")
          if [ -n "${ALIASES}" ]; then
            while IFS= read -r alias; do
              [ -n "$alias" ] || continue
              names+=("$alias")
            done <<< "$ALIASES"
          fi

          for name in "${names[@]}"; do
            ref="$REGISTRY/$OWNER/$name:v$VERSION"
            digest=$(docker manifest inspect "$ref" -v 2>/dev/null | \
              jq -r 'if type == "array" then .[0].Descriptor.digest else .config.digest end') || true
            if [ -z "$digest" ] || [ "$digest" = "null" ]; then
              echo "❌ Unable to resolve digest for $ref" >&2
              exit 1
            fi

            cosign sign "$REGISTRY/$OWNER/$name@$digest"
            cosign attest --predicate "$sbom" --type spdxjson "$REGISTRY/$OWNER/$name@$digest"
          done
