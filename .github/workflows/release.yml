name: Release (build, sbom, checksums)
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
jobs:
  draft-release:
    # Create the release as a draft once, before any job uploads to it. It
    # stays a draft until make release-upload has verified and uploaded the
    # signatures; only then is it published.
    runs-on: ubuntu-latest-x64-m
    permissions:
      contents: write
    steps:
      - name: Create or confirm the draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$state" != "true" ]; then
              echo "❌ release $TAG is already published; refusing to add unsigned assets" >&2
              exit 1
            fi
            echo "draft release $TAG exists"
          else
            pre=()
            case "$TAG" in *-*) pre=(--prerelease) ;; esac
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "$TAG" --notes "Draft: signatures pending." "${pre[@]}"
          fi
  build:
    # Per-arch build on a native runner. Each cell pushes by digest only;
    # the manifest job composes the multi-arch manifest at the public tags.
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - family: goneat-tools
            image: goneat-tools-runner-musl
            target: runner
          - family: goneat-tools
            image: goneat-tools-slim-musl
            target: slim
          - family: goneat-tools-glibc
            image: goneat-tools-runner-glibc
            target: runner
          - family: sbom-tools
            image: sbom-tools-runner-musl
            target: runner
          - family: sbom-tools
            image: sbom-tools-slim-musl
            target: slim
          - family: sbom-tools-glibc
            image: sbom-tools-runner-glibc
            target: runner
          - family: valkey
            image: valkey-server-glibc
            target: server
        platform:
          - name: linux/amd64
            arch: amd64
            runner: ubuntu-latest-x64-m
          - name: linux/arm64
            arch: arm64
            runner: ubuntu-latest-arm64-m
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        run: |
          echo "=== Disk usage before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          docker image prune -af || true
          sudo apt-get clean || true
          echo "=== Disk usage after cleanup ==="
          df -h /
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/${{ matrix.image.family }}/Dockerfile
          target: ${{ matrix.image.target }}
          platforms: ${{ matrix.platform.name }}
          outputs: |
            type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.image }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.image }}-${{ matrix.platform.arch }}
      - name: Export digest
        run: |
          set -eu
          mkdir -p "/tmp/digests/${{ matrix.image.image }}"
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${{ matrix.image.image }}/${digest#sha256:}"
      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image.image }}-${{ matrix.platform.arch }}
          path: /tmp/digests/${{ matrix.image.image }}/*
          if-no-files-found: error
          retention-days: 1
  manifest:
    # Compose per-arch digests into a multi-arch manifest at every public
    # tag (canonical + aliases). Generate SBOM and SHA256SUMS against the
    # composed manifest digest; upload to the GitHub release page.
    needs: [draft-release, build]
    runs-on: ubuntu-latest-x64-m
    strategy:
      fail-fast: false
      # Cap concurrent manifest/alias publishes. Full 7-way concurrency hit
      # GHCR write throttling (HTTP 429 on blob upload / manifest PUT) during
      # v0.5.0-rc.1 and v0.5.0 — re-running a single failed cell alone always
      # passed. max-parallel: 2 keeps release wall-clock reasonable while
      # staying under GHCR's undocumented write ceiling. Pair with the
      # imagetools retry below; neither alone is sufficient if the ceiling
      # moves.
      max-parallel: 2
      matrix:
        include:
          - family: goneat-tools
            image: goneat-tools-runner-musl
            aliases: |
              goneat-tools-runner
              goneat-tools
              goneat-tools-runner-alpine
          - family: goneat-tools
            image: goneat-tools-slim-musl
            aliases: |
              goneat-tools-slim
              goneat-tools-slim-alpine
          - family: goneat-tools-glibc
            image: goneat-tools-runner-glibc
            aliases: |
              goneat-tools-runner-debian
          - family: sbom-tools
            image: sbom-tools-runner-musl
            aliases: |
              sbom-tools-runner
              sbom-tools
              sbom-tools-runner-alpine
          - family: sbom-tools
            image: sbom-tools-slim-musl
            aliases: |
              sbom-tools-slim
              sbom-tools-slim-alpine
          - family: sbom-tools-glibc
            image: sbom-tools-runner-glibc
            aliases: |
              sbom-tools-runner-debian
          - family: valkey
            image: valkey-server-glibc
            aliases: ""
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set version env
        id: meta
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          MAJOR="${VERSION%%.*}"
          {
            echo "VERSION=$VERSION"
            echo "MAJOR=$MAJOR"
          } >> "$GITHUB_ENV"
          {
            echo "version=$VERSION"
            echo "major=$MAJOR"
          } >> "$GITHUB_OUTPUT"
      - name: Compute tags
        id: tags
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
          ALIASES: ${{ matrix.aliases }}
        run: |
          set -eu
          # Pre-release versions (e.g. v0.4.2-rc.1) publish only the exact
          # :v<version> tag — :latest and :v<major> stay pinned to the last
          # stable release. Detected by presence of "-" in VERSION.
          case "$VERSION" in
            *-*) PRERELEASE=1 ;;
            *) PRERELEASE=0 ;;
          esac
          if [ "$PRERELEASE" = "1" ]; then
            CANON_TAGS="$REGISTRY/$OWNER/$IMAGE:v$VERSION"
          else
            CANON_TAGS=$(printf '%s\n' \
              "$REGISTRY/$OWNER/$IMAGE:latest" \
              "$REGISTRY/$OWNER/$IMAGE:v$MAJOR" \
              "$REGISTRY/$OWNER/$IMAGE:v$VERSION")
          fi
          TAGS="$CANON_TAGS"
          if [ -n "${ALIASES}" ]; then
            while IFS= read -r alias; do
              [ -n "$alias" ] || continue
              if [ "$PRERELEASE" = "1" ]; then
                TAGS="${TAGS}"$'\n'"$REGISTRY/$OWNER/$alias:v$VERSION"
              else
                TAGS="${TAGS}"$'\n'"$REGISTRY/$OWNER/$alias:latest"$'\n'"$REGISTRY/$OWNER/$alias:v$MAJOR"$'\n'"$REGISTRY/$OWNER/$alias:v$VERSION"
              fi
            done <<< "$ALIASES"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Download digest artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Compose multi-arch manifest
        id: compose
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -eu
          # Build digest refs from the per-arch digest filenames.
          DIGEST_REFS=""
          for f in /tmp/digests/*; do
            [ -e "$f" ] || continue
            sha="$(basename "$f")"
            DIGEST_REFS="$DIGEST_REFS $REGISTRY/$OWNER/$IMAGE@sha256:$sha"
          done
          if [ -z "$DIGEST_REFS" ]; then
            echo "❌ no per-arch digests found for $IMAGE" >&2
            exit 1
          fi
          # Build tag args (-t per public tag).
          TAG_ARGS=""
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            TAG_ARGS="$TAG_ARGS -t $tag"
          done <<< "$TAGS"
          echo "Composing manifest for $IMAGE"
          echo "  sources:$DIGEST_REFS"
          echo "  tags:$TAG_ARGS"
          # Retry ONLY under GHCR write throttling (429 / toomanyrequests) or
          # transient 5xx. Auth, 403, missing digests, and other permanent
          # failures must fail immediately — do not burn the backoff budget.
          # max-parallel lowers collision rate; 429-scoped retry covers residual
          # blips without a full job re-run. Jitter avoids two matrix cells
          # re-colliding on the same sleep ticks.
          attempt=1
          max_attempts=5
          delay=15
          while true; do
            err_file="$(mktemp)"
            set +e
            # Intentional word-split of tag/digest arg lists (same as pre-v0.5.1).
            # shellcheck disable=SC2086
            docker buildx imagetools create $TAG_ARGS $DIGEST_REFS >"$err_file" 2>&1
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              cat "$err_file"
              rm -f "$err_file"
              if [ "$attempt" -gt 1 ]; then
                echo "✅ imagetools create succeeded on attempt ${attempt}"
              fi
              break
            fi
            cat "$err_file" >&2
            # Match GHCR throttle signatures seen on v0.5.0-rc.1 / v0.5.0:
            # "429 Too Many Requests", "toomanyrequests", and occasional 5xx.
            if ! grep -Eiq '429|too ?many ?requests|toomanyrequests| 50[0-9] |status code: 50[0-9]|HTTP status 50[0-9]' "$err_file"; then
              echo "❌ imagetools create failed with non-retryable error (not 429/5xx); not retrying" >&2
              rm -f "$err_file"
              exit "$rc"
            fi
            rm -f "$err_file"
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "❌ imagetools create failed after ${max_attempts} attempts (429/5xx)" >&2
              exit 1
            fi
            # Full jitter in [0, delay] so parallel cells desync.
            jitter=$((RANDOM % (delay + 1)))
            sleep_for=$((delay + jitter))
            echo "⚠️ imagetools create hit throttle/5xx (attempt ${attempt}/${max_attempts}); retrying in ${sleep_for}s (base ${delay}s + jitter ${jitter}s)..."
            sleep "$sleep_for"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done
          # Resolve composed manifest digest from canonical :v<version> tag.
          CANON_REF="$REGISTRY/$OWNER/$IMAGE:v$VERSION"
          DIGEST=$(docker buildx imagetools inspect "$CANON_REF" --format '{{json .Manifest}}' | jq -r '.digest')
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            echo "❌ unable to resolve composed manifest digest for $CANON_REF" >&2
            exit 1
          fi
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"
      - name: Resolve the index and platform manifest digests
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          scripts/image-digests.sh "$REGISTRY/$OWNER/$IMAGE:v$VERSION" > "DIGESTS-$IMAGE"
          cat "DIGESTS-$IMAGE"
          got=$(awk '$1 == "index" { print $2 }' "DIGESTS-$IMAGE")
          if [ "$got" != "$DIGEST" ]; then
            echo "❌ index digest $got is not the composed manifest $DIGEST" >&2
            exit 1
          fi
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0
      - name: Generate one SBOM per platform manifest (syft)
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          # Each platform manifest gets the SBOM of its own digest. There is
          # no SBOM for the index: one SPDX document cannot describe every
          # platform it names.
          while read -r kind digest platform; do
            [ "$kind" = "child" ] || continue
            out="sbom-$IMAGE-$VERSION-${platform//\//-}.json"
            syft scan "registry:$REGISTRY/$OWNER/$IMAGE@$digest" -o "spdx-json=$out"
            echo "$out ← $digest $platform"
          done < "DIGESTS-$IMAGE"
      - name: Generate SHA256SUMS
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          printf "%s\n" "${{ steps.tags.outputs.tags }}" | sed '/^\s*$/d' | while IFS= read -r ref; do
            echo "$DIGEST  $ref"
          done > SHA256SUMS-${{ matrix.image }}
      - name: Hand the digests and SBOMs to the cosign job
        uses: actions/upload-artifact@v4
        with:
          name: signing-inputs-${{ matrix.image }}
          path: |
            DIGESTS-${{ matrix.image }}
            sbom-${{ matrix.image }}-${{ steps.meta.outputs.version }}-*.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload release assets to the draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" --clobber \
            sbom-"$IMAGE"-"$VERSION"-*.json "SHA256SUMS-$IMAGE" "DIGESTS-$IMAGE"
  cosign:
    needs: manifest
    runs-on: ubuntu-latest-x64-m
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: goneat-tools-runner-musl
            aliases: |
              goneat-tools-runner
              goneat-tools
              goneat-tools-runner-alpine
          - image: goneat-tools-slim-musl
            aliases: |
              goneat-tools-slim
              goneat-tools-slim-alpine
          - image: goneat-tools-runner-glibc
            aliases: |
              goneat-tools-runner-debian
          - image: sbom-tools-runner-musl
            aliases: |
              sbom-tools-runner
              sbom-tools
              sbom-tools-runner-alpine
          - image: sbom-tools-slim-musl
            aliases: |
              sbom-tools-slim
              sbom-tools-slim-alpine
          - image: sbom-tools-runner-glibc
            aliases: |
              sbom-tools-runner-debian
          - image: valkey-server-glibc
            aliases: ""
    permissions:
      id-token: write
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set version env
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "VERSION=$VERSION"
            echo "TAG=v$VERSION"
          } >> "$GITHUB_ENV"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.0"
      # The release is a draft until signing completes, and a read-only token
      # cannot see drafts, so the inputs come from the manifest job's artifact.
      - name: Download the digests and per-platform SBOMs
        uses: actions/download-artifact@v4
        with:
          name: signing-inputs-${{ matrix.image }}
          path: sboms
      - name: Show the signing inputs
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          ls -l sboms
          cat "sboms/DIGESTS-$IMAGE"
      - name: Sign every published name (index and platform manifests; SBOM per platform)
        env:
          COSIGN_YES: "true"
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
          ALIASES: ${{ matrix.aliases }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # one alias per word
          scripts/cosign-release.sh sign "$IMAGE" "$VERSION" "sboms/DIGESTS-$IMAGE" sboms $ALIASES
      - name: Verify every published name against the release workflow identity
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
          ALIASES: ${{ matrix.aliases }}
          CERT_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          export CERT_IDENTITY="https://github.com/$OWNER/fulmen-toolbox/.github/workflows/release.yml@refs/tags/v$VERSION"
          # shellcheck disable=SC2086 # one alias per word
          scripts/cosign-release.sh verify "$IMAGE" "$VERSION" "sboms/DIGESTS-$IMAGE" sboms $ALIASES
