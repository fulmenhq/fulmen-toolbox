name: Build and Push Docker Images (manual)
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  REGISTRY: ghcr.io
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: goneat-tools
            image: goneat-tools-runner
            target: runner
            aliases: |
              goneat-tools
              goneat-tools-runner-musl
              goneat-tools-runner-alpine
          - family: goneat-tools
            image: goneat-tools-slim
            target: slim
            aliases: |
              goneat-tools-slim-musl
              goneat-tools-slim-alpine
          - family: goneat-tools-glibc
            image: goneat-tools-runner-glibc
            target: runner
            aliases: |
              goneat-tools-runner-debian
          - family: sbom-tools
            image: sbom-tools-runner
            target: runner
            aliases: |
              sbom-tools
              sbom-tools-runner-musl
              sbom-tools-runner-alpine
          - family: sbom-tools
            image: sbom-tools-slim
            target: slim
            aliases: |
              sbom-tools-slim-musl
              sbom-tools-slim-alpine
          - family: sbom-tools-glibc
            image: sbom-tools-runner-glibc
            target: runner
            aliases: |
              sbom-tools-runner-debian
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Compute tags
        id: tags
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
          ALIASES: ${{ matrix.aliases }}
        run: |
          set -eu
          CANON_TAGS=$(printf '%s\n' \
            "$REGISTRY/$OWNER/$IMAGE:manual" \
            "$REGISTRY/$OWNER/$IMAGE:${GITHUB_SHA}")
          TAGS="$CANON_TAGS"
          if [ -n "${ALIASES}" ]; then
            while IFS= read -r alias; do
              [ -n "$alias" ] || continue
              TAGS="${TAGS}"$'\n'"$REGISTRY/$OWNER/$alias:manual"$'\n'"$REGISTRY/$OWNER/$alias:${GITHUB_SHA}"
            done <<< "$ALIASES"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/${{ matrix.family }}/Dockerfile
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
