name: echo-proxy-fixture
services:
  echo:
    image: ealen/echo-server:0.9.2
    expose:
      - "80"
    environment:
      PORT: "80"
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${PROXY_PORT:-8080}:80"
    volumes:
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - echo
